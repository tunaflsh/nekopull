# Copy to ~/.config/nekopull/config.toml

# API key, either inline:
apikey = "YOUR-API-KEY"
# ...or omit it and read it from libsecret instead (see below).

# Sub levels to accept: 0 official, 1 lightly edited official, 2 small fansubs,
# 3 full fansubs. Empty list = any level; the highest accepted level wins.
[defaults]
levels = [2, 3]
resolutions = ["1080p"]
min_seeders = 0
allow_batch = false
# groups = ["erai-raws"]   # preference only, never a filter

[client]
type = "transmission"
url = "http://127.0.0.1:9091/transmission/rpc"
username = ""
password = ""
download_dir = "/data/torrents/anime"

# Keep the key in the Secret Service instead of this file:
#
#   secret-tool store --label='nekopull API key' service nekopull username api
#
# then delete the `apikey` line above and uncomment:
#
# [secrets]
# provider = "libsecret"
# service = "nekopull"
# username = "api"

# One block per show; find ids with `nekopull lookup "title"`.
[[show]]
media_id = "s1539"
name = "towa no yuugure"

[[show]]
media_id = "s4147"
name = "enen no shouboutai"
levels = [0, 1]
