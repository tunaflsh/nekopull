# Copy to ~/.config/nekopull/config.toml and fill in the key.
apikey = "YOUR-API-KEY"

[defaults]
# nekoBT sub level: 0 = official subs only, 1 = light edits, 2/3 = fansubs.
# Set max_level = 0 to take only untouched official subs; null disables it.
max_level = 1
resolutions = ["1080p"]
min_seeders = 0
allow_batch = false
allow_v2 = false
groups = []            # preferred release groups, e.g. ["erai-raws"]

[transmission]
url = "http://127.0.0.1:9091/transmission/rpc"
username = ""
password = ""
download_dir = "/data/torrents/anime"

# One block per show. Look the id up with:
#   nekopull lookup towa\ no\ yuugure
[[show]]
media_id = "s1539"
name = "towa no yuugure"

[[show]]
media_id = "s4147"
name = "enen no shouboutai"
max_level = 0
