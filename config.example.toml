# Copy to ~/.config/nekopull/config.toml

# API key. Optional: without it nekoBT searches run anonymously, with lower
# rate limits and public magnets only. On the first `run` or `verify`, nekopull
# moves it into libsecret when secret-tool is available, leaving
# `apikey = "libsecret"` behind.
apikey = "YOUR-API-KEY"
interval = "1d"          # time between daemon polls, e.g. 30m, 6h, 1d

# Sub levels to accept: 0 official, 1 lightly edited official, 2 small fansubs,
# 3 full fansubs. Unset means any level; the highest accepted one wins.
[defaults]
levels = [2, 3]
codec = "h265"            # h264 h265 av1 vp9 mpeg2 xvid wmv vc1
type = "web_dl"           # web_dl bd_remux dvd_raw ...
resolutions = ["1080p"]
batch = false
private_magnet = true    # private magnet carries your passkey; false = public
groups = ["erai-raws"]   # preference only, never a filter

[client]
type = "transmission"
url = "http://127.0.0.1:9091/transmission/rpc"
download_dir = "/data/torrents/anime"
# HTTP auth, if your client needs it. Written here in plain text it is moved to
# libsecret on the next `run`/`verify` and replaced with "libsecret".
username = ""
password = ""

# One block per show; find ids with `nekopull lookup "title"`, and run
# `nekopull annotate` to put the title beside each media_id as a comment.
[[show]]
media_id = "s1539"   # Dusk Beyond the End of the World

# Per-show keys override [defaults], and private_magnet can be set here too:
[[show]]
media_id = "s4147"   # Fire Force
levels = [0, 1]
begin = "S03E07"         # per show only: S03, 3x07, or an absolute number like 55
