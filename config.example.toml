# Copy to ~/.config/nekopull/config.toml

# API key. On the first `run` or `verify`, nekopull moves it into libsecret
# when secret-tool is available, leaving `apikey = "libsecret"` behind.
apikey = "YOUR-API-KEY"

# Sub levels to accept: 0 official, 1 lightly edited official, 2 small fansubs,
# 3 full fansubs. Empty list = any level; the highest accepted level wins.
[defaults]
levels = [2, 3]
# codec = "h265"            # h264, h265 or av1; a string or a list
resolutions = ["1080p"]
allow_batch = false
# groups = ["erai-raws"]   # preference only, never a filter

[client]
type = "transmission"
url = "http://127.0.0.1:9091/transmission/rpc"
download_dir = "/data/torrents/anime"
# HTTP auth, if your client needs it. Written here in plain text it is moved to
# libsecret on the next `run`/`verify` and replaced with "libsecret".
username = ""
password = ""

# One block per show; find ids with `nekopull lookup "title"`.
[[show]]
media_id = "s1539"
name = "towa no yuugure"

[[show]]
media_id = "s4147"
name = "enen no shouboutai"
levels = [0, 1]
