[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nekopull"
version = "0.2.0"
description = "Poll nekoBT by media id and hand new episodes to Transmission"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.scripts]
nekopull = "nekopull:main"

[tool.setuptools]
py-modules = ["nekopull"]
